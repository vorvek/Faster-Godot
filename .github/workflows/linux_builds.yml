name: Linux Release Builds
on:
  workflow_call:
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    production=yes
    tests=no
    optimize=speed
    lto=auto
    debug_symbols=no
    module_text_server_fb_enabled=yes
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 editor
            cache-name: linux-editor
            artifact-name: faster-godot-4.6.3b-linux-x86_64-editor
            target: editor
            scons-flags: ""
            bin: ./bin/faster-godot.linuxbsd.editor.x86_64.faster_godot
            artifact-glob: ./bin/faster-godot.linuxbsd.editor.x86_64.faster_godot
            build-mono: false

          - name: Linux x86_64 .NET editor
            cache-name: linux-editor-mono
            artifact-name: faster-godot-4.6.3b-linux-x86_64-editor-dotnet
            target: editor
            scons-flags: module_mono_enabled=yes
            bin: ./bin/faster-godot.linuxbsd.editor.x86_64.faster_godot.mono
            artifact-glob: ./bin/faster-godot.linuxbsd.editor.x86_64.faster_godot.mono
            build-mono: true

          - name: Linux x86_64 release template
            cache-name: linux-template
            artifact-name: faster-godot-4.6.3b-linux-x86_64-template-release
            target: template_release
            scons-flags: ""
            bin: ./bin/faster-godot.linuxbsd.template_release.x86_64.faster_godot
            artifact-glob: ./bin/faster-godot.linuxbsd.template_release.x86_64.faster_godot
            build-mono: false

          - name: Linux x86_64 .NET release template
            cache-name: linux-template-mono
            artifact-name: faster-godot-4.6.3b-linux-x86_64-template-release-dotnet
            target: template_release
            scons-flags: module_mono_enabled=yes
            bin: ./bin/faster-godot.linuxbsd.template_release.x86_64.faster_godot.mono
            artifact-glob: ./bin/faster-godot.linuxbsd.template_release.x86_64.faster_godot.mono
            build-mono: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Faster-Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Force remove preinstalled .NET SDKs
        if: matrix.build-mono
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup .NET SDK
        if: matrix.build-mono
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET assemblies
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror --no-deprecated

      - name: Save Faster-Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Smoke CLI
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp ${{ matrix.artifact-glob }} release/
          if [ -d bin/GodotSharp ]; then
            cp -R bin/GodotSharp release/GodotSharp
          fi
          strip release/faster-godot.* || true
          chmod +x release/faster-godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact-name }}
          path: release/**
