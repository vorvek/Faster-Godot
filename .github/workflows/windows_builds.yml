name: Windows Release Builds
on:
  workflow_call:
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    production=yes
    tests=no
    optimize=speed
    lto=auto
    debug_symbols=no
    module_text_server_fb_enabled=yes
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 editor
            cache-name: windows-editor
            artifact-name: faster-godot-4.6.3c-windows-x86_64-editor
            target: editor
            scons-flags: windows_subsystem=gui
            test-bin: ./bin/faster-godot.windows.editor.x86_64.faster_godot.console.exe
            artifact-glob: ./bin/faster-godot.windows.editor.x86_64.faster_godot*.exe
            gui-bin: ./bin/faster-godot.windows.editor.x86_64.faster_godot.exe
            build-mono: false
            make-installer: true

          - name: Windows x86_64 .NET editor
            cache-name: windows-editor-mono
            artifact-name: faster-godot-4.6.3c-windows-x86_64-editor-dotnet
            target: editor
            scons-flags: windows_subsystem=gui module_mono_enabled=yes
            test-bin: ./bin/faster-godot.windows.editor.x86_64.faster_godot.mono.console.exe
            artifact-glob: ./bin/faster-godot.windows.editor.x86_64.faster_godot.mono*.exe
            build-mono: true
            make-installer: false

          - name: Windows x86_64 release template
            cache-name: windows-template
            artifact-name: faster-godot-4.6.3c-windows-x86_64-template-release
            target: template_release
            scons-flags: windows_subsystem=gui
            test-bin: ./bin/faster-godot.windows.template_release.x86_64.faster_godot.console.exe
            artifact-glob: ./bin/faster-godot.windows.template_release.x86_64.faster_godot*.exe
            build-mono: false
            make-installer: false

          - name: Windows x86_64 .NET release template
            cache-name: windows-template-mono
            artifact-name: faster-godot-4.6.3c-windows-x86_64-template-release-dotnet
            target: template_release
            scons-flags: windows_subsystem=gui module_mono_enabled=yes
            test-bin: ./bin/faster-godot.windows.template_release.x86_64.faster_godot.mono.console.exe
            artifact-glob: ./bin/faster-godot.windows.template_release.x86_64.faster_godot.mono*.exe
            build-mono: false
            make-installer: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Faster-Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        if: matrix.build-mono
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.test-bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET assemblies
        if: matrix.build-mono
        run: |
          dotnet --info
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows --werror --no-deprecated

      - name: Save Faster-Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Smoke CLI
        run: |
          ${{ matrix.test-bin }} --version
          ${{ matrix.test-bin }} --help

      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -Path "${{ matrix.artifact-glob }}" -Destination release -Force
          if (Test-Path bin/GodotSharp) {
            Copy-Item -Path bin/GodotSharp -Destination release/GodotSharp -Recurse -Force
          }

      - name: Build installer
        if: matrix.make-installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Copy-Item -Path "${{ matrix.gui-bin }}" -Destination misc/dist/windows/faster-godot.exe -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" misc/dist/windows/faster-godot.iss
          Copy-Item -Path misc/dist/windows/faster-godot-setup-x86_64.exe -Destination release -Force

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact-name }}
          path: release/**
