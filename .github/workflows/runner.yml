name: 🔗 GHA
# Faster-Godot release and validation pipeline.
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  source-archive:
    name: Source archive
    needs: static-checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build source tarball
        run: |
          misc/scripts/make_tarball.sh -v 4.6.3b
          mkdir -p release
          mv ../faster-godot-4.6.3b-source.tar.gz release/

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: faster-godot-4.6.3b-source
          path: release/faster-godot-4.6.3b-source.tar.gz

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    uses: ./.github/workflows/windows_builds.yml

  publish-release:
    name: Publish release assets
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    needs:
      - source-archive
      - linux-build
      - windows-build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          for dir in artifacts/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"

            case "$name" in
              *source)
                cp "$dir"/*.tar.gz release-assets/
                ;;
              *windows*)
                (cd "$dir" && zip -qr "../../release-assets/${name}.zip" .)
                if [ -f "$dir/faster-godot-setup-x86_64.exe" ]; then
                  cp "$dir/faster-godot-setup-x86_64.exe" release-assets/
                fi
                ;;
              *linux*)
                tar -C "$dir" -czf "release-assets/${name}.tar.gz" .
                ;;
            esac
          done

          ls -lh release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/faster-godot-4.6.3b" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/faster-godot-4.6.3b" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi

          if gh release view faster-godot-4.6.3b --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit faster-godot-4.6.3b --repo "${{ github.repository }}" --target "$GITHUB_SHA" --latest
          else
            gh release create faster-godot-4.6.3b --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "faster-godot-4.6.3b" --notes "See CHANGES_FROM_OFFICIAL.md in this commit for the full changelist."
          fi

          gh release view faster-godot-4.6.3b --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset faster-godot-4.6.3b "$asset" --repo "${{ github.repository }}" --yes
          done

          gh release upload faster-godot-4.6.3b release-assets/* --repo "${{ github.repository }}" --clobber
