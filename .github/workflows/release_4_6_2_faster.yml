name: Release 4.6.2 Faster

on:
  push:
    branches:
      - codex/release-4.6.2-faster-actions
  workflow_dispatch:

env:
  RELEASE_VERSION: 4.6.2-faster
  RELEASE_TAG: 4.6.2-faster
  SOURCE_REF: 2f1a68ebdce6d7a273cbb3d8bc10af5e39c1e2ab
  BUILD_NAME: faster
  SCONS_BASE: arch=x86_64 production=yes tests=no optimize=speed lto=none debug_symbols=no verbose=no warnings=no werror=no progress=no
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libspeechd-dev \
            libdecor-0-dev \
            libvulkan-dev \
            wayland-protocols \
            libwayland-bin \
            zip

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: bash
        run: |
          python -m pip install scons==4.10.1
          scons --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.100

      - name: Build standard Linux editor and templates
        shell: bash
        run: |
          set -euxo pipefail
          scons platform=linuxbsd target=editor $SCONS_BASE
          scons platform=linuxbsd target=template_debug $SCONS_BASE
          scons platform=linuxbsd target=template_release $SCONS_BASE
          strip bin/godot.linuxbsd.editor.x86_64.faster_godot
          strip bin/godot.linuxbsd.template_debug.x86_64.faster_godot
          strip bin/godot.linuxbsd.template_release.x86_64.faster_godot
          chmod +x bin/godot.linuxbsd.*.x86_64.faster_godot

      - name: Build .NET Linux editor and templates
        shell: bash
        run: |
          set -euxo pipefail
          scons platform=linuxbsd target=editor module_mono_enabled=yes $SCONS_BASE
          bin/godot.linuxbsd.editor.x86_64.faster_godot.mono --headless --generate-mono-glue ./modules/mono/glue
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --no-deprecated --werror
          scons platform=linuxbsd target=template_debug module_mono_enabled=yes $SCONS_BASE
          scons platform=linuxbsd target=template_release module_mono_enabled=yes $SCONS_BASE
          strip bin/godot.linuxbsd.editor.x86_64.faster_godot.mono
          strip bin/godot.linuxbsd.template_debug.x86_64.faster_godot.mono
          strip bin/godot.linuxbsd.template_release.x86_64.faster_godot.mono
          chmod +x bin/godot.linuxbsd.*.x86_64.faster_godot.mono

      - name: Package Linux assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/linux release/templates/standard release/templates/mono

          cp bin/godot.linuxbsd.editor.x86_64.faster_godot \
            release/linux/Faster-Godot_v${RELEASE_VERSION}_linux.x86_64
          (cd release/linux && zip -9 "../Faster-Godot_v${RELEASE_VERSION}_linux.x86_64.zip" \
            "Faster-Godot_v${RELEASE_VERSION}_linux.x86_64")

          mkdir -p "release/linux/Faster-Godot_v${RELEASE_VERSION}_mono_linux_x86_64"
          cp bin/godot.linuxbsd.editor.x86_64.faster_godot.mono \
            "release/linux/Faster-Godot_v${RELEASE_VERSION}_mono_linux_x86_64/Faster-Godot_v${RELEASE_VERSION}_mono_linux.x86_64"
          cp -R bin/GodotSharp "release/linux/Faster-Godot_v${RELEASE_VERSION}_mono_linux_x86_64/GodotSharp"
          (cd release/linux && zip -9 -r "../Faster-Godot_v${RELEASE_VERSION}_mono_linux_x86_64.zip" \
            "Faster-Godot_v${RELEASE_VERSION}_mono_linux_x86_64")

          cp bin/godot.linuxbsd.template_debug.x86_64.faster_godot release/templates/standard/linux_debug.x86_64
          cp bin/godot.linuxbsd.template_release.x86_64.faster_godot release/templates/standard/linux_release.x86_64
          cp bin/godot.linuxbsd.template_debug.x86_64.faster_godot.mono release/templates/mono/linux_debug.x86_64
          cp bin/godot.linuxbsd.template_release.x86_64.faster_godot.mono release/templates/mono/linux_release.x86_64

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.zip
            release/templates/**
          retention-days: 14

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install scons==4.10.1
          scons --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.100

      - name: Build standard Windows editor and templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sconsBase = $env:SCONS_BASE -split ' '
          scons platform=windows target=editor @sconsBase
          scons platform=windows target=template_debug @sconsBase
          scons platform=windows target=template_release @sconsBase
          Remove-Item bin\*.exp, bin\*.lib, bin\*.pdb -ErrorAction SilentlyContinue

      - name: Build .NET Windows editor and templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sconsBase = $env:SCONS_BASE -split ' '
          scons platform=windows target=editor module_mono_enabled=yes @sconsBase
          bin\godot.windows.editor.x86_64.faster_godot.mono.console.exe --headless --generate-mono-glue .\modules\mono\glue
          python .\modules\mono\build_scripts\build_assemblies.py --godot-output-dir=.\bin --godot-platform=windows --no-deprecated --werror
          scons platform=windows target=template_debug module_mono_enabled=yes @sconsBase
          scons platform=windows target=template_release module_mono_enabled=yes @sconsBase
          Remove-Item bin\*.exp, bin\*.lib, bin\*.pdb -ErrorAction SilentlyContinue

      - name: Package Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release\windows, release\templates\standard, release\templates\mono | Out-Null

          New-Item -ItemType Directory -Force "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_win64" | Out-Null
          Copy-Item bin\godot.windows.editor.x86_64.faster_godot.exe "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_win64\Faster-Godot_v${env:RELEASE_VERSION}_win64.exe"
          Copy-Item bin\godot.windows.editor.x86_64.faster_godot.console.exe "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_win64\Faster-Godot_v${env:RELEASE_VERSION}_win64_console.exe"
          Compress-Archive -Path "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_win64\*" -DestinationPath "release\Faster-Godot_v${env:RELEASE_VERSION}_win64.exe.zip" -CompressionLevel Optimal -Force

          New-Item -ItemType Directory -Force "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64" | Out-Null
          Copy-Item bin\godot.windows.editor.x86_64.faster_godot.mono.exe "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64.exe"
          Copy-Item bin\godot.windows.editor.x86_64.faster_godot.mono.console.exe "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64_console.exe"
          Copy-Item bin\GodotSharp "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64\GodotSharp" -Recurse
          Compress-Archive -Path "release\windows\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64\*" -DestinationPath "release\Faster-Godot_v${env:RELEASE_VERSION}_mono_win64.zip" -CompressionLevel Optimal -Force

          Copy-Item bin\godot.windows.template_debug.x86_64.faster_godot.exe release\templates\standard\windows_debug_x86_64.exe
          Copy-Item bin\godot.windows.template_debug.x86_64.faster_godot.console.exe release\templates\standard\windows_debug_x86_64.console.exe
          Copy-Item bin\godot.windows.template_release.x86_64.faster_godot.exe release\templates\standard\windows_release_x86_64.exe
          Copy-Item bin\godot.windows.template_release.x86_64.faster_godot.console.exe release\templates\standard\windows_release_x86_64.console.exe
          Copy-Item bin\godot.windows.template_debug.x86_64.faster_godot.mono.exe release\templates\mono\windows_debug_x86_64.exe
          Copy-Item bin\godot.windows.template_debug.x86_64.faster_godot.mono.console.exe release\templates\mono\windows_debug_x86_64.console.exe
          Copy-Item bin\godot.windows.template_release.x86_64.faster_godot.mono.exe release\templates\mono\windows_release_x86_64.exe
          Copy-Item bin\godot.windows.template_release.x86_64.faster_godot.mono.console.exe release\templates\mono\windows_release_x86_64.console.exe

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.zip
            release/templates/**
          retention-days: 14

  package-templates:
    name: Export template packages
    runs-on: ubuntu-22.04
    needs: [linux, windows]
    timeout-minutes: 30

    steps:
      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
          merge-multiple: true

      - name: Build template packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release standard mono
          cp -R downloaded/templates/standard/. standard/
          cp -R downloaded/templates/mono/. mono/
          echo "4.6.2.stable" > standard/version.txt
          echo "4.6.2.stable.mono" > mono/version.txt
          chmod +x standard/linux_debug.x86_64 standard/linux_release.x86_64
          chmod +x mono/linux_debug.x86_64 mono/linux_release.x86_64
          (cd standard && zip -9 -r "../release/Faster-Godot_v${RELEASE_VERSION}_export_templates.tpz" .)
          (cd mono && zip -9 -r "../release/Faster-Godot_v${RELEASE_VERSION}_mono_export_templates.tpz" .)
          cp downloaded/*.zip release/
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          retention-days: 14
