[package]
name = "salva2d"
version = "0.9.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
description = "2-dimensional particle-based fluid dynamics in Rust."
documentation = "https://salva.rs/docs"
homepage = "https://salva.rs"
repository = "https://github.com/dimforge/salva"
readme = "README.md"
categories = [
    "science",
    "game-development",
    "mathematics",
    "simulation",
    "wasm",
]
keywords = ["physics", "dynamics", "particles", "fluids", "SPH"]
license = "Apache-2.0"
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = [ "dim2", "f32" ]
dim2    = [ ]
f32 = [ ]
parallel = [ "rayon" ]
sampling = [ "rapier" ]
rapier = [ "parry", "rapier2d" ]
rapier-testbed = [ "rapier", "rapier_testbed2d", "graphics", "kiss3d" ]
rapier-harness = [ "rapier-testbed" ]
parry = [ "parry2d" ]
graphics = [ "bevy", "bevy_egui" ]

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim3", "f64"))',
] }

[lib]
name = "salva2d"
path = "../../src/lib.rs"
required-features = [ "dim2", "f32" ]

[dependencies]
approx = "0.5"
num-traits = "0.2"
fnv = "1.0"
itertools = "0.14"
generational-arena = "0.2"
rayon = { version = "1.8", optional = true }

nalgebra = { version = "0.34", features = ["convert-glam030"] }
parry2d = { version = "0", optional = true }
rapier2d = { version = "0", optional = true }
rapier_testbed2d = { version = "0", optional = true }
kiss3d = { version = "0.40", optional = true }

bevy_egui = { version = "0.31", features = ["immutable_ctx"], optional = true }
bitflags = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "x11",
], optional = true }

# Dependencies for WASM only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
], optional = true }
